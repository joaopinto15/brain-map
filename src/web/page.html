<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brain-map</title>
<style>
__STYLE__</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="legend"></div>
<div id="bar">
  <span id="count">0 notes</span>
  <input id="q" placeholder="Search…  /" aria-label="Search notes">
  <span class="sep"></span>
  <button id="rl" title="Rescan the vault for new and changed notes" aria-label="Reload">⟳</button>
  <button id="cfg" title="Settings" aria-label="Settings">⚙</button>
</div>
<!-- Everything configurable lives here; the bar keeps only what you act on. <dialog>
     brings the modality, the backdrop and Esc-to-close with it. -->
<dialog id="settings">
  <header><h2>Settings</h2><button id="cfgclose" title="Close (Esc)">✕</button></header>
  <label for="vaultnow">Vault</label>
  <div class="row"><span id="vaultnow"></span><button id="sw">Change…</button></div>
  <label for="theme">Theme</label>
  <select id="theme"></select>
  <label for="speed">Growth animation</label>
  <select id="speed" title="How long the whole vault takes to assemble"></select>
  <label for="panelw">Explorer width</label>
  <div class="row"><input type="range" id="panelw" min="220" max="900" step="10"><span id="panelwv"></span></div>
  <label for="showtree">Show explorer</label>
  <div class="row"><input type="checkbox" id="showtree"><span class="note">space e</span></div>
</dialog>
<aside id="reader">
  <div id="grip" title="Drag to resize the explorer"></div>
  <div id="tree"></div>
  <header><h2 id="title"></h2><span class="path" id="path"></span><button id="full" title="Fullscreen (F)">⛶</button><button id="edit" title="Open in $EDITOR">✎</button><button id="close" title="Close (Esc)">✕</button></header>
  <div id="tags"></div>
  <div id="body"></div>
</aside>
<div id="picker" hidden>
  <div class="card">
    <h1>brain-map</h1>
    <p>Open a folder of markdown notes as a vault.</p>
    <form id="pick">
      <input id="vaultpath" placeholder="~/notes" spellcheck="false" autocomplete="off" autofocus>
      <button type="button" id="browse" title="Choose a folder">Browse…</button>
      <button type="submit">Open</button>
    </form>
    <p id="pickerr"></p>
    <div id="recent"></div>
  </div>
</div>
<div id="hint">
  <b>drag</b> or <b>hjkl</b> to pan · <b>scroll</b> to zoom · <b>click</b> a node to read it ·
  <b>/</b> searches, <b>n</b>/<b>N</b> walk the matches · <b>space e</b> hides the explorer ·
  <b>R</b> replays · <b>F</b> fullscreen · <b>Esc</b> releases
</div>
<script>
__SCRIPT__</script>
</body>
</html>

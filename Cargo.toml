[package]
name = "brain-map"
version = "0.1.0"
edition = "2021"
license = "MIT"

# The scanner is this crate, the window is `crates/app`, and `crates/model` is the graph
# they meet on. One workspace, one lock: nothing is built for another target any more.
[workspace]
members = ["crates/model", "crates/app"]

[dependencies]
brain-map-app = { path = "crates/app" }
brain-map-model = { path = "crates/model" }

[profile.release]
lto = true

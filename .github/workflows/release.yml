# A tag is the release. Pushing `v0.2.0` builds the binary, runs the tests against it, and
# publishes the tarball the AUR package downloads — nothing here is run by hand.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Built on Arch itself, so the binary links the same library sonames the AUR package
    # will install. A build on another distribution can disagree about them.
    container: archlinux:base-devel
    steps:
      - name: Install the toolchain
        run: >
          pacman -Syu --noconfirm git rust pkgconf
          libglvnd libxkbcommon wayland libx11 libxcursor libxrandr libxi noto-fonts-emoji

      - uses: actions/checkout@v4

      - name: The tag must be the version in Cargo.toml
        run: |
          tag=${GITHUB_REF_NAME#v}
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$tag" = "$crate" ] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $crate"; exit 1; }

      - run: cargo test --workspace --locked
      - run: cargo build --release --locked

      - name: Pack the release
        run: |
          v=${GITHUB_REF_NAME#v}
          install -Dm755 target/release/brain-map dist/brain-map
          install -Dm644 README.md LICENSE -t dist/
          install -Dm644 packaging/brain-map.desktop packaging/brain-map.svg -t dist/
          tar -C dist -czf "brain-map-$v-x86_64.tar.gz" .
          sha256sum "brain-map-$v-x86_64.tar.gz" | tee sha256sums.txt

      # Both AUR packages differ from the ones in the repo by the version, and the binary
      # one by its checksum too. Filling them here means the release ships a PKGBUILD
      # that is already correct — and a .SRCINFO beside it, which the AUR refuses a push
      # without. makepkg will not run as root and this container is root, hence the user
      # made to run it. Rename each pair to PKGBUILD and .SRCINFO in the AUR checkout.
      - name: Stamp the AUR packages for this release
        run: |
          v=${GITHUB_REF_NAME#v}
          sum=$(cut -d' ' -f1 sha256sums.txt)
          useradd --create-home builder
          for pkg in brain-map brain-map-bin; do
            install -d -o builder "/tmp/aur/$pkg"
            sed "s/^pkgver=.*/pkgver=$v/" "packaging/aur/$pkg/PKGBUILD" > "$pkg.PKGBUILD"
            # Only the binary package has a tarball to check; the source one clones a tag.
            if [ "$pkg" = brain-map-bin ]; then
              sed -i "s/^sha256sums=.*/sha256sums=('$sum')/" "$pkg.PKGBUILD"
            fi
            install -o builder "$pkg.PKGBUILD" "/tmp/aur/$pkg/PKGBUILD"
            su builder -c "cd /tmp/aur/$pkg && makepkg --printsrcinfo" > "$pkg.SRCINFO"
            cat "$pkg.SRCINFO"
          done

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            brain-map-*-x86_64.tar.gz
            sha256sums.txt
            brain-map.PKGBUILD
            brain-map.SRCINFO
            brain-map-bin.PKGBUILD
            brain-map-bin.SRCINFO
